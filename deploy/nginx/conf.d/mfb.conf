# ==============================================================================
# My Funding Bank — Reverse proxy vhosts (HTTP + HTTPS)
# ==============================================================================
# `${DOMAIN_NAME}` and `${ADMIN_DOMAIN}` are substituted by the entrypoint or
# you can replace them with real hostnames before mounting into Nginx.
# ==============================================================================

# --------- Internal health probe ----------
server {
    listen 80 default_server;
    server_name _;
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
    # Certbot ACME challenge over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ================== APP DOMAIN (public API + mobile web) ==================
server {
    listen 443 ssl http2;
    server_name app.myfundingbank.in;

    ssl_certificate     /etc/letsencrypt/live/app.myfundingbank.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.myfundingbank.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    limit_conn perip 100;

    # ---- API: /api/* → backend ----
    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://mfb_backend;
    }

    # Stricter auth endpoints
    location ~ ^/api/(auth|admin/login|kyc|withdrawals) {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://mfb_backend;
    }

    # Write-heavy endpoints (payments, ledger)
    location ~ ^/api/(payments|wallet|finance|withdrawals-payout) {
        limit_req zone=api_write burst=30 nodelay;
        proxy_pass http://mfb_backend;
    }

    # Health probes are unrestricted (for load balancers)
    location = /api/health/live  { access_log off; proxy_pass http://mfb_backend; }
    location = /api/health/ready { access_log off; proxy_pass http://mfb_backend; }

    # Prometheus metrics scraping (restricted to internal networks)
    location = /api/metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://mfb_backend;
    }

    # ---- Static assets & mobile web (optional) ----
    location / {
        return 200 '{"service":"mfb-api","status":"ok"}';
        add_header Content-Type application/json;
    }
}

# ================== ADMIN DOMAIN ==================
server {
    listen 443 ssl http2;
    server_name admin.myfundingbank.in;

    ssl_certificate     /etc/letsencrypt/live/admin.myfundingbank.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.myfundingbank.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://app.myfundingbank.in" always;

    limit_conn perip 50;

    location /api/ {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://mfb_backend;
    }

    location / {
        proxy_pass http://mfb_admin;
    }
}
