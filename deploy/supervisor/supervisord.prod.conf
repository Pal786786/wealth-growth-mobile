# ==============================================================================
# My Funding Bank — Production Supervisor Configuration
# ==============================================================================
# Alternative to Docker for VM/bare-metal deployments.
# Copy to /etc/supervisor/conf.d/mfb.conf and run:
#   supervisorctl reread && supervisorctl update && supervisorctl status
# ==============================================================================

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid
nodaemon=false
minfds=65536
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ---------------------- BACKEND (Gunicorn + Uvicorn workers) ----------------------
[program:mfb-backend]
command=/opt/mfb/venv/bin/gunicorn server:app
    --workers %(ENV_WEB_CONCURRENCY)s
    --worker-class uvicorn.workers.UvicornWorker
    --bind 0.0.0.0:8001
    --timeout 60
    --graceful-timeout 30
    --keep-alive 5
    --access-logfile /var/log/mfb/backend.access.log
    --error-logfile /var/log/mfb/backend.error.log
    --log-level %(ENV_LOG_LEVEL)s
directory=/opt/mfb/backend
user=mfb
group=mfb
autostart=true
autorestart=true
startretries=5
startsecs=10
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
environment=WEB_CONCURRENCY="4",LOG_LEVEL="info",PYTHONPATH="/opt/mfb/backend",PROMETHEUS_MULTIPROC_DIR="/var/run/mfb/prom_multiproc",ENVIRONMENT="production"
stderr_logfile=/var/log/mfb/backend.stderr.log
stdout_logfile=/var/log/mfb/backend.stdout.log
stderr_logfile_maxbytes=50MB
stdout_logfile_maxbytes=50MB
stderr_logfile_backups=10
stdout_logfile_backups=10

; ---------------------- APScheduler / Finance Alerts worker ----------------------
; The scheduler runs inside the FastAPI process by default; this optional
; sidecar can be enabled if you want to isolate long-running jobs.
[program:mfb-scheduler]
command=/opt/mfb/venv/bin/python -m finance_ledger.scheduler_worker
directory=/opt/mfb/backend
user=mfb
group=mfb
autostart=false
autorestart=true
startretries=5
stopsignal=TERM
stopwaitsecs=30
environment=PYTHONPATH="/opt/mfb/backend",ENVIRONMENT="production"
stderr_logfile=/var/log/mfb/scheduler.err.log
stdout_logfile=/var/log/mfb/scheduler.out.log

; ---------------------- Nginx ----------------------
[program:mfb-nginx]
command=/usr/sbin/nginx -g "daemon off;" -c /etc/nginx/nginx.conf
autostart=true
autorestart=true
startretries=5
stopsignal=QUIT
stderr_logfile=/var/log/mfb/nginx.err.log
stdout_logfile=/var/log/mfb/nginx.out.log

; ---------------------- MongoDB (single-node prod) ----------------------
[program:mfb-mongo]
command=/usr/bin/mongod --config /etc/mongo/mongod.conf
autostart=true
autorestart=true
startretries=5
stopsignal=INT
stopwaitsecs=60
user=mongodb
stderr_logfile=/var/log/mongodb/mongod.err.log
stdout_logfile=/var/log/mongodb/mongod.out.log

; ---------------------- Group definitions ----------------------
[group:mfb]
programs=mfb-backend,mfb-nginx,mfb-mongo
priority=10
