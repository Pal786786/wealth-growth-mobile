# ==============================================================================
# My Funding Bank — MongoDB Production Config (single-node, replica-set ready)
# ==============================================================================

storage:
  dbPath: /data/db
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      # Keep small on a shared 2-4 GB VPS. Raise to ~50% of RAM on a bigger box.
      cacheSizeGB: 0.5
      journalCompressor: snappy
      directoryForIndexes: true
    collectionConfig:
      blockCompressor: snappy

systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  logRotate: reopen
  verbosity: 0
  component:
    accessControl:
      verbosity: 0

net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 2000
  compression:
    compressors: snappy,zstd

processManagement:
  timeZoneInfo: /usr/share/zoneinfo

security:
  authorization: enabled
  # For replica-set / sharded prod deployments, enable keyfile below:
  # keyFile: /etc/mongo/keyfile

operationProfiling:
  slowOpThresholdMs: 200
  mode: slowOp

setParameter:
  enableLocalhostAuthBypass: false
  authenticationMechanisms: SCRAM-SHA-256

# Uncomment for replica set deployments (recommended for prod HA):
# replication:
#   replSetName: mfbRs0
#   oplogSizeMB: 4096
